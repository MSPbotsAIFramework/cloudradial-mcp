services:
  cloudradial-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cloudradial-mcp:latest
    container_name: cloudradial-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - CLOUDRADIAL_BASE_URL=https://api.us.cloudradial.com
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
